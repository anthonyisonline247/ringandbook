<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password | Ring &amp; Booked</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/theme.css?v=2">
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .reset-shell { width: min(100%, 460px); }
    .brand { display: inline-block; margin-bottom: 30px; color: var(--text); font-weight: 800; font-size: 1.3rem; text-decoration: none; }
    .brand span { color: var(--accent); }
    .reset-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: clamp(24px, 5vw, 38px); box-shadow: 0 14px 38px rgba(25,45,69,.08); }
    .eyebrow { margin: 0 0 8px; color: var(--accent2); font-size: .75rem; font-weight: 800; letter-spacing: .09em; }
    h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2rem); letter-spacing: -.03em; }
    .intro, #reset-status { color: var(--muted); line-height: 1.55; }
    .intro { margin: 12px 0 25px; }
    .reset-form { display: grid; gap: 16px; }
    .reset-form label { display: grid; gap: 7px; color: var(--text); font-size: .92rem; font-weight: 700; }
    .reset-form input { width: 100%; box-sizing: border-box; min-height: 42px; padding: 9px 11px; color: var(--text); border: 1px solid var(--border); border-radius: 8px; background: #fff; font: inherit; }
    .reset-form button { min-height: 44px; border: 0; border-radius: 9px; cursor: pointer; color: #fff; background: var(--accent); font: inherit; font-weight: 800; }
    .reset-form button:disabled { cursor: wait; opacity: .7; }
    .hint { margin: -5px 0 0; color: var(--muted); font-size: .82rem; line-height: 1.45; }
    #reset-status { margin: 18px 0 0; font-size: .92rem; }
    .back { display: inline-block; margin-top: 20px; color: var(--accent2); font-weight: 700; text-decoration: none; }
    [hidden] { display: none !important; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/reset-password.js?v=1"></script>
</head>
<body>
  <main class="reset-shell">
    <a class="brand" href="/">Ring &amp; <span>Booked</span></a>
    <section class="reset-card" aria-labelledby="reset-title">
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1 id="reset-title">Set a new password</h1>
      <p class="intro">Choose a new password for your Ring &amp; Booked account.</p>
      <p id="reset-status" role="status" aria-live="polite">Checking your secure reset link…</p>
      <form id="reset-form" class="reset-form" hidden>
        <label for="new-password">New password
          <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label for="confirm-password">Confirm new password
          <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <p class="hint">Use at least 12 characters. You’ll sign in again after saving your new password.</p>
        <button type="submit" id="reset-submit">Update password</button>
      </form>
      <a class="back" href="/?login=1">← Back to login</a>
    </section>
  </main>
</body>
</html>
